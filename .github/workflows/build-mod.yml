name: Build Mod

on:
  push:
    paths:
      - 'howtofish-mod/**'
      - '.github/workflows/build-mod.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build howtofish-mod/src/HowToFishMod/HowToFishMod.csproj -c Release /p:Version=0.0.${{ github.run_number }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HowToFishMod-dll
          path: |
            howtofish-mod/src/HowToFishMod/bin/Release/netstandard2.0/*.dll
